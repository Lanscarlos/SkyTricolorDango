# 复制为 config.toml 再改。没写的项都用默认值（见 src/skydango/config.py）。
# 坐标一律是 0~1 的归一化值：[x, y] 相对截图宽高。用 `skydango shot --grid` 截一张带网格的图来读坐标。

[device]
# MuMu 自带的 adb 更稳：MuMu 安装目录下的 shell\adb.exe
adb_path = "adb"
# MuMu 12 第一个实例是 127.0.0.1:16384，多开第 N 个是 16384 + 32*N（多开器里可以查看）
serial = "127.0.0.1:16384"

[vision]
poll_interval = 0.15
mode = "log"                  # 读聊天记录面板（光遇按 C 打开）；"bubble" 找头顶气泡；"roi" 整块 OCR
roi = [0.0, 0.0, 1.0, 0.85]   # 只在这块区域里找气泡，排除底部操作栏

[vision.bubble]
# 用 `skydango detect 截图.png` 反复试这几项
min_value = 215
max_saturation = 45
min_fill = 0.7

[panel]
# 聊天记录面板什么时候开（设计见 docs/superpowers/specs/2026-09-29-chat-panel-on-demand-design.md）。
# "always" = 一直开着（现在的做法）；"auto" = 平时关着，把镜头和整个画面让给技能 / YOLO：
#   每 idle_peek 秒按 C 看一眼，身边来了好友 / 有人走近 / 好友头顶冒出"正在输入"时提前看，读到新消息就一直开着，
#   安静 quiet_close 秒再关。2026-09-30 真机验收后默认 "auto"（见 docs/game-ops.md §3）
mode = "auto"
idle_peek = 30.0          # 闲着时多久看一眼（秒）
quiet_close = 45.0        # 聊天中安静多久关面板
peek_cooldown = 5.0       # 两次看一眼至少隔多久
bubble_wait = 15.0        # 看到气泡后最多开着等多久
bubble_gone = 3.0         # 气泡消失后再等多久
bubble_strangers = false  # 陌生人的气泡也触发（没解锁聊天的陌生人在面板里只有省略号）
open_timeout = 1.5        # 按 C 后最多等多久面板出现

[ocr]
min_score = 0.6

[run]
# 每次 `skydango run` 在这里建一个目录（如 runs/20260927-153012-live/）：
# agent.log 日志、rows.log 面板识别记录、replies.jsonl 回复记录、frames/ 面板截图、config.json 配置快照
dir = "runs"
keep = 20                     # 只留最近 20 次，旧的自动删；0 表示不删
save_frames = true            # 读到新消息时截聊天面板存 JPG

[chat]
debounce = 0.8
ignore_patterns = []          # 正则，比如 ["^\\.+$"] 忽略只有省略号的气泡

[reply]
dry_run = true                # 先 dry-run 看效果；`skydango run --live` 才会真的发
disclosure_prefix = "【AI】"   # 让对方知道是 AI，建议保留
max_chars = 40
min_interval = 3.0
max_per_minute = 8
# memory_dir = "private/memory"  # 默认 "memory"；记忆放私有仓库时指过去（见 CLAUDE.md「两台电脑共用记忆」）
persona = """
你叫三彩团子，是光遇里一个很可爱的女孩子，玩了挺久了。
最喜欢樱花发型，特意把自己的光之子调成了小个子，平时爱穿可爱风的衣服，看到好看的斗篷和发型会走不动路。
性格软萌但不做作，爱开玩笑，偶尔吐槽；喜欢跑图、收集先祖、坐着看风景。聊天像和熟人说话，不端着。
"""

# 认识的人：游戏昵称 = 说明（本名、怎么称呼、什么关系），会写进提示词
# [reply.friends]
# "好友昵称" = "本名小明，好朋友，平时叫他小明"

# 主人命令模式：填游戏里显示的昵称，和聊天记录面板 speaker 精确匹配；留空 = 关闭。
# 开启后主人发的 #friend/#remember/#pause/#resume/#status 会被当命令执行，不转发给大模型（只有 vision.mode = "log" 时生效）。
# owner_name = "懒洋洋大王"

[llm]
# 大脑离线时的备用回复、run --no-brain 的普通 Agent（回复和记忆整理）用它；大脑模式的记忆整理用 [brain] memory_model
provider = "anthropic"
base_url = ""
model = "claude-sonnet-5"
api_key_env = "ANTHROPIC_API_KEY"   # 从这个环境变量读 Key，不要把 Key 写进文件
# 也可以用 OpenAI 兼容接口（DeepSeek / 通义千问 / Kimi / 本地 Ollama）：
# provider = "openai"
# base_url = "https://api.deepseek.com"
# model = "deepseek-chat"
# api_key_env = "DEEPSEEK_API_KEY"

[emotes]
# 聊天时让模型挑时机做动作。牵着手也能做，不会松手（走动才会）
enabled = true
# 可以换上轮盘的动作（图标库 emotes/ 里的名字），不在轮盘上时会换到 swap_slots 里再做
extra = []
# 允许换的格子；为空就只用轮盘上现有的动作。退出时换回原来的动作
swap_slots = []
min_interval = 20.0           # 两次动作至少隔几秒
swap_min_interval = 120.0     # 两次换轮盘至少隔几秒（换一次要关聊天面板 5~10 秒）

[perception]
# YOLO 感知层（还在开发，模型要自己训练）：持续检测人物 / 名字标签 / 互动圆圈，替代 [env] 的定时整图 OCR，还能认出陌生人
# 测速：python -m skydango perception bench --model yolo11n.pt（没训练前先用官方模型看硬件够不够）
enabled = false
model = "models/sky-yolo.onnx"  # .onnx 用 onnxruntime；.pt / .engine 用 ultralytics（要 torch，核显机器上别用）
device = "cuda"                 # cuda（N 卡，装 onnxruntime-gpu）/ dml（核显、A 卡，装 onnxruntime-directml，只对 .onnx 有用）/ cpu
imgsz = 960                     # 要和训练时一致
fps = 15.0
capture = "body"                # "own"：感知线程自己截图，才能到 15 fps
hold_max = 60.0                 # 黑屏、转镜头、开好友树、换轮盘时暂停计时（不误报"走开了"）；超过这么久自动恢复
occlusion_hold = 30.0           # 多人同时不见 + 画面大变（自己开了地图 / 商店）时最多暂停这么久
hardcases = true                # 可能认错的画面存到 runs/<这次>/hard/（每次最多 hardcase_max 张），下一轮只补标这些
audit_interval = 30.0           # 难例的旁路核对：每隔这么久后台整图 OCR 一次（约 1 s CPU）；0 = 不核对
hardcase_max = 200
low_conf = 0.25                 # 检测器出框阈值；conf 以下的框只给难例收集看
near = 0.8                      # 远近：人物框高 ÷ 团子框高 ≥ 这个算近（待标定）
far = 0.4                       # < 这个算远，中间算中（待标定）
self_height = 0.2               # 还没认出团子框时，假定团子框高占屏高的比例（待标定）
approach_grow = 0.25            # 走过来：1.5 秒内框高增大这么多、且往画面中间走（待标定）
approach_cooldown = 60.0        # 同一个人这么久内只报一次
approach_strangers = true       # 陌生人走过来也报；陌生人多的地方嫌吵就关掉
typing_window = 8.0             # 陌生人发消息前这么久内头顶冒过气泡的人，才算可能的说话人（待真机确认）
bubble_gap = 1.0                # 同一个人的气泡消失超过这么久再出现算新的一句（空闲注意力用）
far_height = 0.08               # 远处的人（框高 < 屏高 × 这个）没挂上名字标签时，头顶裁一块再检测一次
far_crops = 3                   # 每帧最多裁几块；0 = 关（perception compare --far-crops 0 对比开关效果）
object_min_hits = 3             # 物品（座位 / 篝火 / 乐器 / 先祖）连续看到几帧才算
object_near = 0.85              # 物品远近按框底边：底边 ≥ 画面高 × 这个算近（待标定）
object_far = 0.65               # ≥ 这个算中，再高算远（待标定）
edge_band = 0.06                # 名字标签贴在屏幕最左 / 最右这么宽里、又没挂上人 = 好友在画面外，不算在身边；0 = 关
# 追踪和接回（数字都没标定，先 perception track-eval 在录像上定；开关全关 = 原来的行为）
sticky_names = true             # 挂过名字标签的轨迹不断就一直算在身边（好友稍远名字标签会淡掉）；false = 照旧
track_low = true                # 低分框续旧轨迹（只续不开新的）
track_predict = true            # 速度预测 + 中心距离兜底
track_center_gate = 0.6         # 中心距离门槛（× 预测框高）
track_pan = true                # 估计画面平移（转镜头）并补偿
relink = true                   # 好友轨迹断了，keep 秒内在附近冒出来的没名字的人按位置接回成"像他"
motion = true                   # 运动方向：走近 / 走远 / 往左走 / 往右走 / 站着
motion_window = 1.5             # 看最近这么久（秒）
motion_grow = 0.15              # 框高变化比例超过这个算走近 / 走远
motion_side = 0.6               # 横向位移超过这么多个身高算往左 / 往右
motion_hold = 0.5               # 新结论连续这么久才换

[places]
# 认地图（感知层三期，要先打开 [perception]）：和 places/<地名>/ 里的参考截图比，认出在哪张图
# 加图：python -m skydango places add 云野；看准不准：places test / places bench
enabled = false
dir = "places"                  # 图库（不进 git）
model = "models/places.onnx"    # 图像特征模型（ONNX）；"thumb" = 内置的缩略图基线（不用下载模型，准确率差）
size = 224
norm = "imagenet"               # imagenet / clip / none（MobileCLIP 用 none）
place_min = 0.8                 # 最像的相似度至少这么高（待标定）
place_margin = 0.05             # 且比第二像的别的地方高这么多
place_interval = 30.0           # 每隔这么久认一次（画面大变后也认一次）

[appearance]
# 认装扮（要先打开 [perception]）：从人物框裁图算外观特征，名字标签看不到时把人认回来；数字多是估的，未在真机验证
enabled = false
model = "color"                 # "color" = 内置颜色直方图；或 .onnx 特征模型路径
size = 224                      # 同 [places]
norm = "imagenet"
device = "cpu"                  # cuda / dml / cpu，同 [perception]
every = 3                       # 每条轨迹每几帧算一次特征
max_per_frame = 4               # 一帧最多算几个
min_height = 0.10               # 好样本的框高（相对截图高度）
max_overlap = 0.2               # 和别的框 / 面板重叠超过这个比例就不算好样本
ema = 0.2                       # 平均特征的更新速度
min_samples = 3                 # 判 maybe / 陌生人编号 / 换装前至少几个好样本
match = 0.85                    # 相似度门槛（估的，以离线标定为准）
card_match = 0.92               # 只有关系卡旧特征时的门槛（更严）
margin = 0.05                   # 最像的要比第二像的高这么多
recheck = 5                     # maybe 连续这么多个新样本低于门槛就摘掉
outfit_change = false           # 判不判换装：颜色特征下同一身衣服常被误判成换装（10-01 标定），默认不判；
                                # 关着时好友 / 团子每次上线描述一次、覆盖关系卡最近那一套
changed = 0.40                  # outfit_change 开着时：低于它算换了装
stranger_forget = 1800.0        # 陌生人编号这么久没出现就忘掉（秒）
describe = true                 # 关掉就只认人、不调模型
describe_model = "haiku"
describe_min_height = 0.18      # 送去描述的框高
describe_max = 20               # 每小时最多描述几次
redescribe_max = 3              # 同一个人一次上线最多重新描述几次
outfit_keep = 3                 # 关系卡每人留几套
quota_wait = 600.0              # 额度用完后隔多久再试（秒）
retry_after = 60.0              # 描述不清楚时隔多久用新样本再试（秒）
describe_timeout = 60.0
save = true                     # 攒训练数据
save_every = 2.0                # 同一条轨迹最多隔几秒存一张
save_max = 2000                 # 一次运行最多存几张

[attrs]
# 人物复核（第二层，要先打开 [perception]）：给 YOLO 的人物框裁图再判一次——挡树 / 石像等误框、捞低分框、认先祖 / 共享空间的人、点没点火两边投票。
# 模型用 `perception attrs-train` 训练，过了上线门槛再打开；数字都是估的，未在真机验证。低分框的阈值复用 [perception] low_conf
# 本机 onnxruntime 是 CPU 版（一张裁图约 32 ms）：装 onnxruntime-gpu 之前别开，或者 max_crops = 1、every = 1.0
enabled = false
model = "models/attrs.npz"      # 线性头文件
backbone = "models/dinov2-small.onnx"  # 冻住的特征主干，文件名要和 npz 里记的一致
device = ""                     # 空 = 跟 [perception] device
every = 0.5                     # 同一条轨迹隔这么久判一次（秒）
max_crops = 4                   # 每一轮最多裁几个框
votes = 5                       # 属性投票看最近几次
accept = 0.6                    # 投票概率到这个才算认定
reject = 0.7                    # 复核判成"不是人"的概率门槛
reject_n = 3                    # 累计复核够这么多次、平均下来"不是人"的概率还 ≥ reject 才撤下
yolo_w = 0.3                    # 点没点火的黑影分里 YOLO 一侧（最近几帧 player_unlit 的比例）的权重；< 0.5 外形头才翻得动 YOLO
flip_votes = 3                  # 形态要翻转，新形态至少连续几票
max_errors = 10                 # 推理连续出错这么多次就自己关掉

[assist]
# Claude 辅助标注：python -m skydango perception label <录像目录> --assist
# 检测器出人物候选框 → 隔离的 claude -p 核对（令牌、配置目录同 [brain]）→ 和名字标签 / 圆圈弱标注合并写进数据集
min_change = 30.0               # 挑帧：和上一张留下的帧差这么多才留（--all-frames 不挑）
max_gap = 20                    # 最多隔这么多帧强制留一张
proposal_models = ["models/yolo11n.pt", "models/yolo11x.pt"]  # 没给 --model 时的候选框模型（COCO person 类）
proposal_conf = 0.1
proposal_imgsz = 1280
batch = 5                       # 每次 claude -p 核对几帧
jobs = 3                        # 同时跑几个 claude -p
timeout = 300.0
model = "sonnet"
self_hint = "白色头发、橙色护目镜、橙粉色袍子、背蓝紫色圆背包、头顶没有名字标签"  # 团子长相，换装后改

[gesture]
# 别人对团子做的动作（感知层三期，研究性质，还没有模型）：好友对着团子挥手、鞠躬时告诉大脑，由它决定回不回礼
# 数据：record --fps 8 录 → perception clips 切片段 → 人工分到 <动作>/ → 训练导出 ONNX → perception gesture-eval 评估
enabled = false
model = "models/gesture.onnx"
labels = ["none", "wave", "bow", "cheer", "shy"]  # 模型输出的顺序（第一版：挥手、鞠躬、欢呼、害羞）
names = { wave = "挥手", bow = "鞠躬", cheer = "欢呼", shy = "害羞" }
dataset = "datasets/gesture"    # 动作数据目录（_unlabeled/ 刚切的片段，<动作>/ 分好类的）
stride = 8                      # 切片段时每隔几帧起一段（16 帧一段 → 半重叠）
min_prob = 0.9                  # 宁可不报：精确率不到 90% 不要打开
cooldown = 30.0                 # 同一个人同一种动作这么久内只报一次

[spin]
# 转一圈：主人发 #spin（普通模式）、命令行 camera spin、打开感知层时大脑的 look_around
seconds_per_turn = 2.0          # 按住方向键转一圈要几秒（估的，待 camera spin 标定）
fps = 15.0                      # 转的时候每秒截几张
max_turns = 2                   # #spin 最多转几圈
min_interval = 10.0             # 两次 #spin 至少隔几秒
hfov = 90.0                     # 画面水平视野角（度），算方位用（待 camera spin 标定）
merge_deg = 30.0                # 陌生人方位相差不到这么多度算同一个
self_motion = 0.03              # 转一圈时几乎不动（移动 < 画面宽 × 这个）、一直在中间的就是团子

[track]
# 大脑的 track(名字, 秒)：小步转镜头把好友保持在画面中间（要打开 [perception]）；实测见 docs/game-ops.md §2「转视角实测（D0）」
deadband = 0.15                 # 目标离画面中线不到半屏宽的这么多就不转（≈ 144 px，要大于最小修正量 35~40 px）
gain = 0.15                     # 按键秒数 = gain × 偏差（半屏宽算 1）；2026-09-30 真机：0.1 追不上近处横着走的人
nudge_min = 0.02                # 最短按键（秒）：2026-09-29 D0 实测一下就移 35~40 px
nudge_max = 0.1                 # 最长按键（秒）：2026-09-29 D0 实测 0.1 s ≈ 66 px，近处的人 0.2 s 以后就饱和（换角度、注意力用）
chase_max = 0.15                # 盯人自己的最长按键（秒）：2026-09-30 真机 0.1 追不上
settle = 0.6                    # 按完等画面停稳再看（秒）：2026-09-29 D0 实测松手 0.3~0.6 s 后位置才稳定
lost_after = 3.0                # 这么多秒看不到目标算跟丢
max_age = 0.5                   # 名字标签超过这么多秒没更新就不用（人物框本来就只给 1 秒内的）
stall_nudges = 3                # 同方向连续按这么多次……
stall_px = 20.0                 # ……误差缩小不到这么多像素 = 离得太近转不动了，停手（D0：近处的人横移有上限）；变大了这么多是追不上，接着追
max_seconds = 60                # 一次最多盯多久

[peek]
# look_person 发现好友躲在团子身后（只有名字标签、压在团子框上）：边转边看 YOLO 让他露出来，太小就拉近；看完镜头不复位
# 按键长短、等画面停稳、转不动的判断沿用 [track]。数字都是估的，没在真机标定
enabled = true
self_center = 0.35              # YOLO 的团子框中心离屏幕中线不超过屏宽的这么多才采信（团子是镜头支点，一般在中间；2026-09-30 实测镜头没跟正时偏到 29%）
too_close = 0.5                 # 团子框高超过屏高的这么多 = 镜头贴太近，先拉远再转
too_small = 0.25                # 露出来的好友框高不到屏高的这么多 = 看不清，拉近
clear_overlap = 0.3             # 好友框和团子框水平重叠不到好友框宽的这么多 = 露出来了
gain = 0.3                      # 按键秒数 = gain × 还差多少（半屏宽算 1），夹到 [track] nudge_min~nudge_max
max_zoom_out = 2
max_zoom_in = 3
max_presses = 10                # 转 + 缩放一共最多按几次
max_seconds = 8.0               # 最多花多久
tag_age = 1.0                   # 名字标签超过这么多秒没更新就不算
poll = 0.15                     # 等画面停稳后，每隔这么久看一次感知结果

[call]
# 按 Q 喊一声（大脑模式，要配合 [perception]；spec docs/superpowers/specs/2026-10-01-q-call-design.md）：
# 稍远的好友头顶亮出名字约 5 秒。大脑有 call 工具；好友刚“走开”、画面里还有没挂名字的人时身体自动喊一次。数字都是估的
enabled = true
auto = true
min_gap = 20.0                  # 任意两次至少隔几秒（卡洛 # 命令窗口里大脑不受限）
auto_quota = 3                  # 身体自动喊：auto_window 秒里最多几次
auto_window = 600.0
auto_after_leave = 30.0         # 好友走开多少秒内还会为他自动喊（同一次走开只喊一次）
window = 6.0                    # 按键后这么久里亮出来的名字都算
burst = 1.0                     # 按键后连拍几秒看光圈
halo = false                    # 光圈认团子：认错会把好友当成团子藏起来，先 perception halo-eval 标定再开
halo_rise = 25.0                # 头顶平均灰度比按键前高出这么多算冒圈（估的）
halo_center = 0.35              # 冒圈的人离画面中线不超过屏宽的这么多才算团子

[viewer]
# 识别可视化网页：python -m skydango view（只看不动）或 run --view，浏览器里实时看画面 + 识别框
# 画面里有好友昵称和聊天：默认只给本机看。改成 "0.0.0.0" 手机也能看，但同一局域网的人都能看
host = "127.0.0.1"
port = 19399
fps = 10.0                      # 最多每秒更新几帧（run --view 时受身体主循环限制，约 6~7 帧）
width = 1280                    # 发给浏览器的图缩到这么宽
quality = 70                    # JPEG 质量

[brain]
# 统管大脑：常驻的 Claude Code（订阅）看眼睛写的场景描述、调身体的工具。`run --brain` 打开
# 先运行一次 claude setup-token，把生成的令牌放进用户环境变量：setx SKYDANGO_CLAUDE_TOKEN "<令牌>"
enabled = false
model = "sonnet"
effort = "low"
eyes_model = "haiku"           # 眼睛：把截图写成文字
memory_model = "sonnet"        # 记忆整理：随手记 inbox.md、整理 notes.md（live 时；memory update 也用它）
history_turns = 20             # 启动时带上最近几轮聊天原话（重启后接得上话），0 不带
heartbeat = [45, 90, 180]      # 没事件时多久醒一次（身边有好友从第一档起），闲着就退到下一档
background_wait = 20.0         # 背景事件（陌生人来去、好友走开、已处理的互动请求…）不马上叫醒大脑，攒了这么久还没醒才叫醒一次
rejoin = 60.0                  # 好友走开后这么久内又出现算"回来了"（背景事件），不再叫醒大脑打招呼
move_step = 0.3                # 移动每步按住方向键的秒数（0.3 s 几乎不动、1 s 幅度很大，见 game-ops §2）
move_min_interval = 3.0        # 两次 move 调用最小间隔（秒）
owner_name = ""                # 卡洛的游戏昵称，精确匹配；留空 = 主人命令模式关闭
owner_window = 30.0            # 收到卡洛一条 # 开头的命令后，放宽 move/emote/camera 限制多少秒

[proactive]
# 看场合主动开口（大脑模式）：眼睛挑新鲜事叫醒大脑、状态里给“场合”、主动开口有护栏。数字都是估的，没在真机验证
enabled = true                 # false = 完全照旧（只接话、不主动）
notice_min = 60.0              # 两个 notice（眼睛注意到的新鲜事 / 换了地图）至少隔几秒
prev_max_age = 600.0           # 上一份场景描述超过几秒就不拿来比
auto_look_busy = 60.0          # 好友在身边时眼睛最久几秒看一次（越短越费订阅额度）
busy_window = 180.0            # 热闹：这么多秒里别人说了至少 busy_lines 句
busy_lines = 4
reply_window = 90.0            # 主动那句之后多少秒内有好友说话算有人接
quota_window = 600.0           # 主动开口额度的时间窗口（秒）
quota_busy = 4                 # 热闹时窗口内最多主动说几句
quota_quiet = 2                # 安静时窗口内最多主动说几句
min_gap = 60.0                 # 两句主动的话之间至少隔几秒
greet_window = 60.0            # 好友刚来这么多秒内、团子还没开口：打招呼不受 min_gap 限制（额度照旧）
cold_after = 3                 # 连续几句主动的话没人接就暂停主动，等有好友说话
self_names = ["团子", "三彩"]   # 聊天里出现这些字算“叫了你”

[lull]
# 冷场时的心理活动（大脑模式，spec docs/superpowers/specs/2026-10-01-lull-musing-design.md）：好友在身边不说话了 / 聊着聊着走了，
# 按节点叫醒大脑、让它在心里想（“心里：…”），冷场结束时带给大脑、进反思。数字都是估的，没在真机验证
enabled = true                 # false = 完全照旧（不认冷场、走开 / 回来照旧是背景事件）
talk_window = 300.0            # 最后一句之前多少秒内有好友说过话，才算“刚才在聊”
stages = [60.0, 180.0, 360.0]  # 冷场多少秒时各叫醒一次（聊着聊着走了的用后两个）
leave_spoke = 120.0            # 好友走开时他多少秒内说过话，算聊着聊着走了
leave_said = 60.0              # 好友走开时团子多少秒内说过话，算聊着聊着走了
leave_grace = 15.0             # 聊着聊着走开后多少秒还没回来才叫醒（名字标签闪一下不算）
musing_max = 60                # “心里：”一行最多几个字

[attention]
# 空闲注意力（东张西望，spec docs/superpowers/specs/2026-09-30-idle-attention-design.md）：闲着时按兴趣小步转镜头
# 看说话 / 走近 / 对团子做动作的人，没什么可看就随意看看；只在 [panel] mode = "auto"、聊天面板关着时动。数字都是估的
enabled = true
talk_friend = 1.0               # 基础兴趣：好友在说话
act_on_me = 0.9                 # 有人对团子做动作
approach = 0.7                  # 有人朝团子走过来
talk_stranger = 0.4             # 陌生人在说话
friend_present = 0.2            # 画面里站着的好友
focus_interest = 1.0            # 大脑 attention(focus=…) 关注的人
min_interest = 0.15             # 低于它不算目标
bore_rate = 0.2                 # 在画面中间时每秒涨的看腻（0~1）
recover_rate = 0.05             # 不在中间时每秒消的看腻
stuck_bored = 0.5               # 转不动时加的看腻
center_band = 0.4               # 画面中间多宽算"已经在看"
gain = 0.1                      # 按键秒数 = gain × 偏差（半屏宽算 1），夹到 [track] nudge_min~nudge_max
switch_margin = 0.2             # 新目标要高出这么多才换
switch_hold = 2.0               # 刚换过目标这么多秒内不换
look_first = 2.0                # 冒气泡 / 有人走近时先看这么久再让聊天面板开
wander_min = 8.0                # 没什么可看时，隔 wander_min~wander_max 秒随意看一眼（再乘心情精力 / 模式的倍数）
wander_max = 20.0
wander_presses = [2, 4]         # 随意看一次连按几下
wander_same_side = 2            # 往同一边连着随意看最多几次
max_step = 1.0                  # 每圈时间差上限（沙盒模拟时钟会跳时间）

[reflex]
# 身体反射（大脑模式）：有人跟团子说话马上冒“正在输入”气泡、别人挥手回礼、闲着做小动作；只用轮盘上已有的动作。数字都是估的，没在真机验证
enabled = true                 # false = 完全照旧
bubble = true                  # 有人跟团子说话时马上打开输入框，大脑想好了用这个框发
followup_window = 30.0         # 团子说完多少秒内好友接话，算“在跟团子说”（叫名字、身边只有一个好友也算）
bubble_max = 45.0              # 替大脑开的框最长开多久
# addressed = ["点头"]         # 被叫到时开框前偶尔做的小动作（要在轮盘上）
addressed_chance = 0.3
# idle = ["伸懒腰", "坐下"]    # 闲着时的小动作
idle_min = 180.0               # 闲着 idle_min~idle_max 秒（随机）做一个
idle_max = 420.0
return_chance = 0.7
quota_window = 600.0           # 反射动作额度：这么多秒里最多 quota 个（不占大脑的动作冷却）
quota = 4
min_gap = 4.0                  # 任何两个动作之间至少隔几秒
# [reflex.return_map]          # 回礼：别人对团子做的动作（[gesture] labels）→ 团子回的动作
# wave = "挥手"
# bow = "鞠躬"

[inner]
# 内心层第 1 期（大脑模式）：给好友记关系卡（见过几次、上次什么时候、待了多久、说过几句）、每次上线记一行（日子），
# 大脑在“来到身边”、status、系统提示词「日子」里看到。存在 <memory_dir>/inner/，只在 --live 时写。数字都是估的，没在真机验证
enabled = true                 # false = 完全照旧
visit_gap = 1800.0             # 离上次在场超过这么多秒再出现，算新的一次见面
session_gap = 7200.0           # 第一次启用时从 history.jsonl 回填：相邻两轮隔这么多秒算两次上线
long_gap = 7.0                 # 超过这么多天没见算“好久没见”
save_every = 60.0              # live 时每隔多少秒存一次（被强杀时最多丢这么久的账）
max_step = 5.0                 # 算在一起待了多久时，单圈最多算几秒
# 第 2 期：反思（心情、精力、闹别扭、惦记的事，下线写日记代替大脑写的经过）。数字都是估的，没在真机验证
reflect = true                 # false = 只记账（第 1 期原样）
reflect_model = "sonnet"       # 反思用的模型（一次性 claude -p，令牌同大脑）
reflect_every = 1200.0         # 有动静（有人说话 / 好友来去）时多久反思一次
reflect_after_quiet = 180.0    # 好友说够 reflect_min_lines 句后安静这么久也反思一次
reflect_min_lines = 6
reflect_timeout = 90.0         # 一次反思最多等多久（下线那次也是）
rest_gap = 3600.0              # 两次上线隔多久算睡过一觉（不到就接着上次的累算）
grudge_min_days = 3            # 一起玩过几天的好友才可能闹别扭
grudge_max = 7200.0            # 别扭最长多久，到点自己消气
wants_max = 3                  # 心愿 / 惦记的事最多几条
want_days = 7.0                # 心愿几天后过期
diary_prompt = 1               # 启动时「日子」里带几篇日记
# 第 3 期：性格（反思顺带攒口头禅 / 老梗 / 看法，进系统提示词；提示词加「脾气」；好友说难过就对他收着点）。数字都是估的，没在真机验证
persona = true                 # false = 第 2 期原样（沉淀要 reflect = true；reflect = false 时只有提示词和收着点）
fade_days = 14.0               # 多少天没用的口头禅 / 老梗 / 看法淡出
catchphrases_max = 5           # 口头禅最多几条
jokes_per_friend = 3           # 每个好友最多几条老梗
jokes_max = 20                 # 老梗总共最多几条
opinions_max = 10              # 看法最多几条（一个话题一句）
soft_minutes = 30.0            # 好友说难过后多久内对他收着点

[backstage]
# 幕后（大脑模式）：团子知道自己是 AI、主人（[brain] owner_name）做了她，能跟主人聊自己怎么运作、用 introspect 查自己的内心细节，
# 启动时知道主人上次以来改了她什么（git 提交）。好友要在 friends.md 他那一节写「知道团子是 AI」，团子才会跟他承认。没在真机验证
enabled = false
changelog_max = 10             # 「更新记录」最多几条
changelog_days = 7             # 第一次（没有 inner/backstage.json）往前看几天

[friend_check]
# 大脑的 check_friend 工具：点一下人物打开右侧好友树面板，截图给大脑看是不是好友，再关掉
# 关面板用 ESC（用户确认）；面板样子还没核对：先用 python -m skydango friend-check X Y 试，确认后再打开
enabled = false
close = ["esc"]                 # 关面板的办法，依次试：esc / back（安卓返回键）/ tap（点 close_tap，归一化坐标）
close_tap = []
min_interval = 30.0             # 两次确认至少隔几秒

[panels]
# 面板识别（大脑模式）：画面上开着哪些面板（动作面板、轮盘编辑、好友树、各种弹框），操作前不被挡，大脑能读文字、按按钮
# 特征卡在 assets/panels/<名字>/card.toml；五张卡都还没核对（录样本、核对步骤见 docs/game-ops.md「面板」）
enabled = true
cards_dir = "assets/panels"
ocr_threads = 2                 # 细读 / 通用兜底单独用的 OCR 线程数
scan_interval = 5.0             # 通用兜底：没有别的触发时，隔多久看一次屏幕中部
unknown_cooldown = 2.0          # 两次通用兜底扫描至少隔这么久
unknown_roi = [0.15, 0.08, 0.85, 0.92]  # 通用兜底 OCR 的区域（避开左边聊天面板、底部输入栏）
unknown_min_chars = 6           # 除按钮外至少这么多字才算面板
unknown_pad = 0.02              # 不认识的面板框：文字外接框往外扩
unknown_ttl = 30.0              # 这么久没再确认过就当它关了
unknown_blocks = false          # 不认识的面板挡不挡操作；真机核对误报率之前只报告、不拦（头顶气泡、告示牌可能误认）
change = 0.25                   # 画面变化触发阈值（实测后调）
button_max_chars = 6
button_words = ["确定", "取消", "关闭", "加入", "同意", "好的", "知道了", "返回", "拒绝", "稍后", "以后再说", "确认", "重试"]
retreat = ["关闭", "取消", "返回", "拒绝", "稍后", "知道了", "以后再说"]   # 撤退类：按钮文字就是这个词（可带标点）才能直接按
never = ["购买", "充值", "支付", "兑换", "删除", "屏蔽", "举报", "退出", "注销"]  # 永远不按，主人 #允许 也不按
permit_window = 60.0            # 卡洛在聊天里发「#允许 按钮」后多久内能按一次
read_ttl = 15.0                 # panel_press 要求 panel_read 在这么久以内
ui_delay = 0.8                  # 关面板 / 按按钮后等界面动画

[sender]
# 打开聊天输入框：光遇（MuMu「PC端操作方案」）里按实体键盘 Enter 就会打开。
# 28 是 Linux 的 KEY_ENTER，通过 sendevent 模拟实体键盘；adb 的 input keyevent 游戏不认
open_chat_key = 28
# 也可以改成点击按钮：open_chat_key = 0，open_chat = [x, y]
open_chat = []
open_delay = 1.0              # 按键后最多等多久；输入框一出现就开始输入
# 提交方式："editor_action"（输入法的发送动作）/ "enter"（回车键）/ "tap"（点 send_button）
submit = "editor_action"
editor_action = 4             # 不生效就试 6 或 2
send_button = []
close_with_back = true         # 发完按 BACK 关掉输入框，否则头顶会一直显示“正在输入”的气泡

# [console]
# 管理面板（python -m skydango console）。其余项（上次的启动选项等）由面板写进 console.toml，
# 面板里改的设置也写在 console.toml（叠加在本文件之后），密钥写在 secrets.toml；两个文件都不进 git
# port = 19390        # 面板端口
# child_port = 19391  # 面板起的团子子进程的 viewer 端口

[sandbox]
# 大脑沙盒（管理面板「沙盒」页）：不开 MuMu，假世界 + 真大脑 / 内心层；只写 <dir>/memory/，永远不写 memory/
dir = "sandbox"          # 沙盒目录（memory/、scenarios/、reports/、clock.json），不进 git；放私有仓库时写 "private/sandbox"
port = 19392             # 沙盒子进程的接口端口
step_timeout = 180.0     # 回放时每步最多等多久安静（秒，真实时间）
wake_hour = 9            # "睡一晚" / "到明早" 拨到几点
emotes = []              # 没有 emotes/ 图标库时假装轮盘上有这些动作，如 ["鞠躬", "挥手"]
