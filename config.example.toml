# 复制为 config.toml 再改。没写的项都用默认值（见 src/skydango/config.py）。
# 坐标一律是 0~1 的归一化值：[x, y] 相对截图宽高。用 `skydango shot --grid` 截一张带网格的图来读坐标。

[device]
# MuMu 自带的 adb 更稳：MuMu 安装目录下的 shell\adb.exe
adb_path = "adb"
# MuMu 12 第一个实例是 127.0.0.1:16384，多开第 N 个是 16384 + 32*N（多开器里可以查看）
serial = "127.0.0.1:16384"

[vision]
poll_interval = 0.15
mode = "log"                  # 读聊天记录面板（光遇按 C 打开）；"bubble" 找头顶气泡；"roi" 整块 OCR
roi = [0.0, 0.0, 1.0, 0.85]   # 只在这块区域里找气泡，排除底部操作栏

[vision.bubble]
# 用 `skydango detect 截图.png` 反复试这几项
min_value = 215
max_saturation = 45
min_fill = 0.7

[ocr]
min_score = 0.6

[run]
# 每次 `skydango run` 在这里建一个目录（如 runs/20260927-153012-live/）：
# agent.log 日志、rows.log 面板识别记录、replies.jsonl 回复记录、frames/ 面板截图、config.json 配置快照
dir = "runs"
keep = 20                     # 只留最近 20 次，旧的自动删；0 表示不删
save_frames = true            # 读到新消息时截聊天面板存 JPG

[chat]
debounce = 0.8
ignore_patterns = []          # 正则，比如 ["^\\.+$"] 忽略只有省略号的气泡

[reply]
dry_run = true                # 先 dry-run 看效果；`skydango run --live` 才会真的发
disclosure_prefix = "【AI】"   # 让对方知道是 AI，建议保留
max_chars = 40
min_interval = 3.0
max_per_minute = 8
persona = """
你叫三彩团子，是光遇里一个很可爱的女孩子，玩了挺久了。
最喜欢樱花发型，特意把自己的光之子调成了小个子，平时爱穿可爱风的衣服，看到好看的斗篷和发型会走不动路。
性格软萌但不做作，爱开玩笑，偶尔吐槽；喜欢跑图、收集先祖、坐着看风景。聊天像和熟人说话，不端着。
"""

# 认识的人：游戏昵称 = 说明（本名、怎么称呼、什么关系），会写进提示词
# [reply.friends]
# "好友昵称" = "本名小明，好朋友，平时叫他小明"

# 主人命令模式：填游戏里显示的昵称，和聊天记录面板 speaker 精确匹配；留空 = 关闭。
# 开启后主人发的 #friend/#remember/#pause/#resume/#status 会被当命令执行，不转发给大模型（只有 vision.mode = "log" 时生效）。
# owner_name = "懒洋洋大王"

[llm]
# 聊天回复、记忆整理、大脑离线时的备用回复都用它（大脑自己用 [brain] 里的型号）
provider = "anthropic"
base_url = ""
model = "claude-sonnet-5"
api_key_env = "ANTHROPIC_API_KEY"   # 从这个环境变量读 Key，不要把 Key 写进文件
# 也可以用 OpenAI 兼容接口（DeepSeek / 通义千问 / Kimi / 本地 Ollama）：
# provider = "openai"
# base_url = "https://api.deepseek.com"
# model = "deepseek-chat"
# api_key_env = "DEEPSEEK_API_KEY"

[emotes]
# 聊天时让模型挑时机做动作。做动作会松开牵手：牵着手时用 `run --no-emotes`
enabled = true
# 可以换上轮盘的动作（图标库 emotes/ 里的名字），不在轮盘上时会换到 swap_slots 里再做
extra = []
# 允许换的格子；为空就只用轮盘上现有的动作。退出时换回原来的动作
swap_slots = []
min_interval = 20.0           # 两次动作至少隔几秒
swap_min_interval = 120.0     # 两次换轮盘至少隔几秒（换一次要关聊天面板 5~10 秒）

[perception]
# YOLO 感知层（还在开发，模型要自己训练）：持续检测人物 / 名字标签 / 互动圆圈，替代 [env] 的定时整图 OCR，还能认出陌生人
# 测速：python -m skydango perception bench --model yolo11n.pt（没训练前先用官方模型看硬件够不够）
enabled = false
model = "models/sky-yolo.onnx"  # .onnx 用 onnxruntime（N 卡装 onnxruntime-gpu）；.pt / .engine 用 ultralytics
device = "cuda"
imgsz = 960                     # 要和训练时一致
fps = 15.0
capture = "body"                # "own"：感知线程自己截图，才能到 15 fps
hold_max = 60.0                 # 黑屏、转镜头、开好友树、换轮盘时暂停计时（不误报"走开了"）；超过这么久自动恢复
occlusion_hold = 30.0           # 多人同时不见 + 画面大变（自己开了地图 / 商店）时最多暂停这么久
hardcases = true                # 可能认错的画面存到 runs/<这次>/hard/（每次最多 hardcase_max 张），下一轮只补标这些
audit_interval = 30.0           # 难例的旁路核对：每隔这么久后台整图 OCR 一次（约 1 s CPU）；0 = 不核对
hardcase_max = 200
low_conf = 0.25                 # 检测器出框阈值；conf 以下的框只给难例收集看
near = 0.8                      # 远近：人物框高 ÷ 团子框高 ≥ 这个算近（待标定）
far = 0.4                       # < 这个算远，中间算中（待标定）
self_height = 0.2               # 还没认出团子框时，假定团子框高占屏高的比例（待标定）
approach_grow = 0.25            # 走过来：1.5 秒内框高增大这么多、且往画面中间走（待标定）
approach_cooldown = 60.0        # 同一个人这么久内只报一次
approach_strangers = true       # 陌生人走过来也报；陌生人多的地方嫌吵就关掉
typing_window = 8.0             # 陌生人发消息前这么久内头顶冒过气泡的人，才算可能的说话人（待真机确认）
far_height = 0.08               # 远处的人（框高 < 屏高 × 这个）没挂上名字标签时，头顶裁一块再检测一次
far_crops = 3                   # 每帧最多裁几块；0 = 关（perception compare --far-crops 0 对比开关效果）

[spin]
# 转一圈：主人发 #spin（普通模式）、命令行 camera spin、打开感知层时大脑的 look_around
seconds_per_turn = 2.0          # 按住方向键转一圈要几秒（估的，待 camera spin 标定）
fps = 15.0                      # 转的时候每秒截几张
max_turns = 2                   # #spin 最多转几圈
min_interval = 10.0             # 两次 #spin 至少隔几秒
hfov = 90.0                     # 画面水平视野角（度），算方位用（待 camera spin 标定）
merge_deg = 30.0                # 陌生人方位相差不到这么多度算同一个
self_motion = 0.03              # 转一圈时几乎不动（移动 < 画面宽 × 这个）、一直在中间的就是团子

[viewer]
# 识别可视化网页：python -m skydango view（只看不动）或 run --view，浏览器里实时看画面 + 识别框
# 画面里有好友昵称和聊天：默认只给本机看。改成 "0.0.0.0" 手机也能看，但同一局域网的人都能看
host = "127.0.0.1"
port = 8765
fps = 10.0                      # 最多每秒更新几帧（run --view 时受身体主循环限制，约 6~7 帧）
width = 1280                    # 发给浏览器的图缩到这么宽
quality = 70                    # JPEG 质量

[brain]
# 统管大脑：常驻的 Claude Code（订阅）看眼睛写的场景描述、调身体的工具。`run --brain` 打开
# 先运行一次 claude setup-token，把生成的令牌放进用户环境变量：setx SKYDANGO_CLAUDE_TOKEN "<令牌>"
enabled = false
model = "sonnet"
effort = "low"
eyes_model = "haiku"           # 眼睛：把截图写成文字
heartbeat = [45, 90, 180]      # 没事件时多久醒一次（身边有好友从第一档起），闲着就退到下一档
move_step = 0.3                # 移动每步按住方向键的秒数（0.3 s 几乎不动、1 s 幅度很大，见 game-ops §2）
move_min_interval = 3.0        # 两次 move 调用最小间隔（秒）
owner_name = ""                # 卡洛的游戏昵称，精确匹配；留空 = 主人命令模式关闭
owner_window = 30.0            # 收到卡洛一条 # 开头的命令后，放宽 move/emote/camera 限制多少秒

[friend_check]
# 大脑的 check_friend 工具：点一下人物打开右侧好友树面板，截图给大脑看是不是好友，再关掉
# 关面板用 ESC（用户确认）；面板样子还没核对：先用 python -m skydango friend-check X Y 试，确认后再打开
enabled = false
close = ["esc"]                 # 关面板的办法，依次试：esc / back（安卓返回键）/ tap（点 close_tap，归一化坐标）
close_tap = []
min_interval = 30.0             # 两次确认至少隔几秒

[sender]
# 打开聊天输入框：光遇（MuMu「PC端操作方案」）里按实体键盘 Enter 就会打开。
# 28 是 Linux 的 KEY_ENTER，通过 sendevent 模拟实体键盘；adb 的 input keyevent 游戏不认
open_chat_key = 28
# 也可以改成点击按钮：open_chat_key = 0，open_chat = [x, y]
open_chat = []
open_delay = 1.0              # 按键后最多等多久；输入框一出现就开始输入
# 提交方式："editor_action"（输入法的发送动作）/ "enter"（回车键）/ "tap"（点 send_button）
submit = "editor_action"
editor_action = 4             # 不生效就试 6 或 2
send_button = []
close_with_back = true         # 发完按 BACK 关掉输入框，否则头顶会一直显示“正在输入”的气泡
