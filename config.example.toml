# 复制为 config.toml 再改。没写的项都用默认值（见 src/skydango/config.py）。
# 坐标一律是 0~1 的归一化值：[x, y] 相对截图宽高。用 `skydango shot --grid` 截一张带网格的图来读坐标。

[device]
# MuMu 自带的 adb 更稳：MuMu 安装目录下的 shell\adb.exe
adb_path = "adb"
# MuMu 12 第一个实例是 127.0.0.1:16384，多开第 N 个是 16384 + 32*N（多开器里可以查看）
serial = "127.0.0.1:16384"

[vision]
poll_interval = 0.15
mode = "log"                  # 读聊天记录面板（光遇按 C 打开）；"bubble" 找头顶气泡；"roi" 整块 OCR
roi = [0.0, 0.0, 1.0, 0.85]   # 只在这块区域里找气泡，排除底部操作栏
debug_dir = ""                # 例如 "debug"：读到新消息时保存标注截图

[vision.bubble]
# 用 `skydango detect 截图.png` 反复试这几项
min_value = 215
max_saturation = 45
min_fill = 0.7

[ocr]
min_score = 0.6

[chat]
debounce = 0.8
ignore_patterns = []          # 正则，比如 ["^\\.+$"] 忽略只有省略号的气泡

[reply]
dry_run = true                # 先 dry-run 看效果；`skydango run --live` 才会真的发
disclosure_prefix = "【AI】"   # 让对方知道是 AI，建议保留
max_chars = 40
min_interval = 8.0
max_per_minute = 4
persona = """
你叫三彩团子，是光遇里一个很可爱的女孩子，玩了挺久了。
最喜欢樱花发型，特意把自己的光之子调成了小个子，平时爱穿可爱风的衣服，看到好看的斗篷和发型会走不动路。
性格软萌但不做作，爱开玩笑，偶尔吐槽；喜欢跑图、收集先祖、坐着看风景。聊天像和熟人说话，不端着。
"""

[llm]
# OpenAI 兼容接口：DeepSeek / 通义千问 / Kimi / 本地 Ollama 都行，改 base_url 和 model 即可
provider = "openai"
base_url = "https://api.deepseek.com"
model = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"   # 从这个环境变量读 Key，不要把 Key 写进文件
# provider = "anthropic"
# base_url = ""
# model = "claude-haiku-4-5"
# api_key_env = "ANTHROPIC_API_KEY"

[sender]
# 打开聊天输入框：光遇（MuMu「PC端操作方案」）里按实体键盘 Enter 就会打开。
# 28 是 Linux 的 KEY_ENTER，通过 sendevent 模拟实体键盘；adb 的 input keyevent 游戏不认
open_chat_key = 28
# 也可以改成点击按钮：open_chat_key = 0，open_chat = [x, y]
open_chat = []
open_delay = 1.0              # 按键后最多等多久；输入框一出现就开始输入
# 提交方式："editor_action"（输入法的发送动作）/ "enter"（回车键）/ "tap"（点 send_button）
submit = "editor_action"
editor_action = 4             # 不生效就试 6 或 2
send_button = []
close_with_back = true         # 发完按 BACK 关掉输入框，否则头顶会一直显示“正在输入”的气泡
