<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>团子管理面板</title>
<link rel="stylesheet" href="static/brain_trace.css">
<link rel="stylesheet" href="console/static/console.css">
</head>
<body class="console" data-state="idle">

<aside id="side">
  <div class="brand"><span class="dango" aria-hidden="true"><i></i><i></i><i></i></span>三彩团子</div>

  <div id="runcard" class="runcard" data-state="idle" role="status" aria-live="polite">
    <div class="rc-k"><span class="rc-dot" aria-hidden="true"></span><span id="rc-title">连接面板…</span></div>
    <div class="rc-m" id="rc-sub"></div>
    <details class="rc-log" id="rc-log" hidden><summary>看日志</summary><pre id="rc-log-text">读取中…</pre></details>
    <button class="btn sm halt" id="rc-stop" type="button" hidden>停止</button>
  </div>

  <nav id="nav" aria-label="页面">
    <div class="g">运行</div>
    <a href="#sandbox" data-page="sandbox">沙盒<small class="mark" id="mark-sandbox"></small></a>
    <a href="#live" data-page="live">真机团子<small class="mark" id="mark-live"></small></a>
    <div class="g">复盘</div>
    <a href="#inner" data-page="inner">内心<small class="mark" id="mark-inner"></small></a>
    <a href="#scenarios" data-page="scenarios">剧本和报告<small class="mark" id="mark-scenarios"></small></a>
    <div class="g">配置</div>
    <a href="#settings" data-page="settings">设置<small class="mark" id="mark-settings"></small></a>
    <a href="#device" data-page="device">设备<small class="mark" id="mark-device"></small></a>
  </nav>

  <p class="side-foot">只在本机能打开。<br>密钥写在本机 secrets.toml。</p>
</aside>

<main id="work">
  <section id="page-sandbox" class="page" hidden><p class="placeholder">（沙盒页还在搬家）</p></section>
  <section id="page-live" class="page" hidden><p class="placeholder">（真机团子页还在搬家）</p></section>
  <section id="page-inner" class="page" hidden>
    <div class="page-title">
      <h1 id="inner-title">团子的内心</h1>
      <span class="seg" id="inner-source-toggle" role="group" aria-label="看谁的内心"><button type="button" data-src="dango" aria-pressed="true">团子</button><button type="button" data-src="sandbox" aria-pressed="false">沙盒</button></span>
      <span class="chip" id="inner-source">读取中…</span>
      <span class="grow"></span>
      <button class="btn sm" type="button" id="inner-refresh">刷新</button>
    </div>
    <div class="cols inner-cols">
      <div class="inner-col">
        <section class="pane" id="inner-now" aria-label="现在"></section>
        <section class="pane">
          <h3>曲线<span class="grow"></span><span class="seg" id="inner-range"><button type="button" data-h="24" aria-pressed="true">最近 24 小时</button><button type="button" data-h="168" aria-pressed="false">7 天</button></span></h3>
          <div class="pane-body" id="inner-curve"></div>
        </section>
        <section class="pane">
          <h3>反思记录<span class="grow"></span><label class="inner-check"><input type="checkbox" id="inner-changed"> 只看有改动的</label></h3>
          <div class="pane-body" id="inner-log"></div>
        </section>
      </div>
      <div class="inner-col">
        <section class="pane"><h3>性格档案</h3><div class="pane-body" id="inner-persona"></div></section>
        <section class="pane"><h3>关系卡</h3><div class="pane-body" id="inner-cards"></div></section>
        <section class="pane"><h3>日子和日记</h3><div class="pane-body" id="inner-days"></div></section>
      </div>
    </div>
  </section>
  <section id="page-scenarios" class="page" hidden><p class="placeholder">（剧本和报告页还在搬家）</p></section>
  <section id="page-settings" class="page" hidden><p class="placeholder">（设置页还在搬家）</p></section>
  <section id="page-device" class="page" hidden><p class="placeholder">（设备页还在搬家）</p></section>
</main>

<div id="dialog" hidden></div>
<div id="toasts" aria-live="polite"></div>

<script src="static/brain_trace.js"></script>
<script src="console/static/common.js"></script>
<script src="console/static/markdown.js"></script>
<script src="console/static/inner.js"></script>
<script src="console/static/sandbox.js"></script>
<script src="console/static/live.js"></script>
<script src="console/static/scenarios.js"></script>
<script src="console/static/settings.js"></script>
<script src="console/static/device.js"></script>
</body></html>
