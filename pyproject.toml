[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skydango"
version = "0.1.0"
description = "光遇（Sky: Children of the Light）视觉 Agent —— 运行在 MuMu 模拟器上的自动聊天原型"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
# 离线可用的 OCR（模型随 wheel 分发，无需首次联网下载）
# rapidocr_onnxruntime 1.3+ 只支持 Python < 3.13；3.13 上改用 rapidocr 3.x（首次运行会下载模型）
ocr = [
    "rapidocr_onnxruntime>=1.3; python_version < '3.13'",
    "rapidocr>=3.0; python_version >= '3.13'",
    "onnxruntime>=1.17; python_version >= '3.13'",
]
# OpenAI 兼容接口：DeepSeek / 通义千问 / Kimi / Ollama / vLLM 等
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.116"]
brain = ["mcp>=2.2", "uvicorn>=0.30"]
# YOLO 感知层：训练 / 用 .pt、.engine 模型推理。50 系显卡先装 cu128 的 torch，再装这个
yolo = ["ultralytics>=8.3"]
dev = ["pytest>=8", "pillow>=10"]
all = ["skydango[ocr,openai,anthropic,brain]"]

[project.scripts]
skydango = "skydango.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skydango = ["console/static/*.html", "console/static/*.css", "console/static/*.js", "vision/static/*.js", "vision/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
