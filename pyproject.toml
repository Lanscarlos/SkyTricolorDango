[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skydango"
version = "0.1.0"
description = "光遇（Sky: Children of the Light）视觉 Agent —— 运行在 MuMu 模拟器上的自动聊天原型"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
# 离线可用的 OCR（模型随 wheel 分发，无需首次联网下载）
ocr = ["rapidocr_onnxruntime>=1.3"]
# OpenAI 兼容接口：DeepSeek / 通义千问 / Kimi / Ollama / vLLM 等
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "pillow>=10"]
all = ["skydango[ocr,openai,anthropic]"]

[project.scripts]
skydango = "skydango.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
